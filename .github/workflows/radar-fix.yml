name: Radar Flow Fix

on:
  push:
    paths:
      - ".radar-fix-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch radar flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('.flowgrid{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin-bottom:12px}', '.flowgrid{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;margin-bottom:12px;align-items:start}', 1)
          s = s.replace("function strengthen(x0){let x=en(x0),live=(x.changePct??0)>0&&x.score.total>=64&&((x.volumeRatio??0)>=1.1||(x.score.relative60??0)>3)&&((x.mom20??0)>0||(x.macdHist??0)>0);return hist()?((x.rd??0)>=5||(x.sd??0)>=2.5||live):live}", "function strengthen(x0){let x=en(x0),idx=S.d?.index?.changePct??0,out=(x.changePct??0)-idx,live=x.score.total>=60&&out>=.6&&((x.volumeRatio??0)>=.65||(x.score.relative??0)>=48||(x.score.relative60??0)>1)&&((x.mom20??0)>-2||(x.macdHist??0)>0||x.score.trend>=60);return hist()?((x.rd??0)>=3||(x.sd??0)>=1.5||live):live}", 1)
          old = "function renderFlow(){let a=cats()[S.flow]||[],g=GUIDE[S.flow];$('#helpT').textContent=g[0];$('#helpP').textContent=g[1];$('#helpA').innerHTML=`<b>Ne yapmalı?</b> ${esc(g[2])}`;let em='Bu bölümde şu an hisse yok.';if(!hist()&&['strong','weak'].includes(S.flow))em='Bu bölüm iki tarama karşılaştırınca anlamlı olur. Bir sonraki taramada dolmaya başlayacak.';$('#cards').innerHTML=a.length?a.slice(0,10).map(card).join(''):`<div class=\"empty\">${em}</div>`;bind()}"
          new = "function flowStrength(x){let idx=S.d?.index?.changePct??0;return((x.changePct??0)-idx)*4+(x.score.total??0)*.35+(x.score.relative??0)*.18+(Math.min(x.volumeRatio??0,2))*7+(x.mom20??0)*.12}function flowFallback(type){let a=(S.d?.stocks||[]).map(en);if(type==='new')return a.filter(x=>x.score.total>=66&&x.score.total<78).sort((a,b)=>b.score.total-a.score.total).slice(0,6);if(type==='strong')return a.filter(x=>x.score.total>=70).sort((a,b)=>b.score.total-a.score.total).slice(0,6);if(type==='gainers')return a.filter(x=>x.score.total>=56).sort((a,b)=>flowStrength(b)-flowStrength(a)).slice(0,6);if(type==='early')return a.filter(x=>x.score.total>=60&&x.score.total<72).sort((a,b)=>b.score.total-a.score.total).slice(0,6);if(type==='weak')return a.sort((a,b)=>((a.score.total??50)+(a.score.trend??50)+(a.score.relative??50))-((b.score.total??50)+(b.score.trend??50)+(b.score.relative??50))).slice(0,6);return[]}const FALLBACK_NOTE={new:'Şu an gerçek bir yeni radar girişi yok. Boş bırakmak yerine radar eşiğine en yakın hisseleri gösteriyorum.',strong:'Karşılaştırmada net gücünü koruyan olayı çıkmadı. Mevcut durumda radar puanı en yüksek hisseleri gösteriyorum.',gainers:'Net bir güçlenme olayı çıkmadı. Bugün BIST’e göre daha iyi duran ve teknik puanı yüksek hisseleri gösteriyorum.',early:'Net erken sinyal çıkmadı. Radar eşiğine en yakın izleme adaylarını gösteriyorum.',weak:'Net zayıflama olayı çıkmadı. Mevcut görünümü görece daha zayıf olan hisseleri risk takibi için gösteriyorum.'};function renderFlow(){let a=cats()[S.flow]||[],g=GUIDE[S.flow],fallback=false;$('#helpT').textContent=g[0];$('#helpP').textContent=g[1];if(!a.length){a=flowFallback(S.flow);fallback=!!a.length}$('#helpA').innerHTML=fallback?`<b>Şu an:</b> ${esc(FALLBACK_NOTE[S.flow])}<br><b>Ne yapmalı?</b> ${esc(g[2])}`:`<b>Ne yapmalı?</b> ${esc(g[2])}`;$('#cards').innerHTML=a.length?a.slice(0,10).map(card).join(''):`<div class=\"empty\">Bu grupta şu an hisse yok. Sistem sinyal üretmek için zorlanmıyor.</div>`;bind()}"
          if old not in s:
              raise SystemExit('renderFlow pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix radar flow empty state [skip ci]"
          git push
