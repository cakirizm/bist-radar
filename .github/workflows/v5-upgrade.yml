name: V5 Decision Cockpit

on:
  push:
    paths:
      - ".v5-trigger"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade UI and guidance
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<meta name="color-scheme" content="dark">','<meta name="color-scheme" content="light">',1)
          s=s.replace('<title>BIST Radar V4</title>','<title>BIST Radar V5</title>',1)
          s=s.replace('V4 · kişisel karar ekranı','V5 · karar kokpiti',1)
          css=r'''\n/* V5 LIGHT PROFESSIONAL THEME */\n:root{--bg:#f4f7fb;--p:#ffffff;--p2:#f8fafc;--bd:#dfe6ee;--t:#142033;--m:#6f7d90;--s:#415066;--g:#13966f;--r:#d94d5c;--a:#c9861a;--b:#3157c8}\nbody{background:linear-gradient(180deg,#f8fafc 0,#f1f5f9 58%,#edf2f7 100%);color:var(--t);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.top{background:rgba(255,255,255,.92);border-bottom:1px solid #e4e9f0;box-shadow:0 1px 12px rgba(25,42,70,.06)}.logo{color:#0f1d31}.logo small{color:#7a8798}.panel{background:#fff;border-color:#e1e7ef;box-shadow:0 8px 24px rgba(28,45,72,.055)}.search,.tools input,.portform input,.notes{background:#fff;border-color:#d9e1ea;color:#152238}.btn{background:#fff;border-color:#d9e1ea;color:#26364d;box-shadow:0 2px 7px rgba(25,42,70,.04)}.btn:hover{border-color:#aebbd0}.btn.main{background:#183b72;color:#fff;border-color:#183b72}.btn.main:hover{background:#112f60}.head h1{color:#10213a}.updated,.muted{color:#7c899a}.price{color:#0f2036}.healthscore{color:#16365f}.plain,.decstats div,.qitem,.card,.metric,.ins div,.portnote,.portsum,.action,.kap{background:#f8fafc;border-color:#e2e8f0;color:#334155}.qitem:hover,.card:hover{border-color:#9fb0c7;background:#f4f7fb}.tab,.chip{background:#f8fafc;border-color:#dfe6ee;color:#66758a}.tab.on,.chip.on{background:#eaf0fb;border-color:#b7c7e6;color:#183b72}.help{background:#f7f9fc;border-color:#dfe7f1}.help strong{color:#17355f}.help p{color:#69788d}.help div{color:#46566d}.line{background:#e9eef4}.line i{background:linear-gradient(90deg,#3157c8,#26a58a)}.bar{background:#edf1f5}.bar i{background:linear-gradient(90deg,#dc5c68,#d5a137,#2ca58a)}.newsitem{border-color:#e6ebf1}.newsitem a{color:#17263d}.newsmeta{color:#8090a3}.tools{border-color:#e5eaf0}.tw{background:#fff}th{background:#f7f9fc;color:#738197;border-color:#e4e9ef}td{color:#405067;border-color:#edf1f5}tbody tr:hover{background:#f7f9fc}.stock b{color:#17263d}.stock small{color:#7d8b9c}.sp{background:#eef3f9;color:#28466f}.drawer{background:#fff;border-color:#dde4ed;box-shadow:-18px 0 40px rgba(24,43,71,.14)}.dh,.dtabs{border-color:#e4e9ef}.dtab{color:#758399}.dtab.on{color:#183b72;border-color:#3157c8}.chart{background:#fbfcfe;border-color:#e1e7ef}.circle:after{background:#fff}.aline span{color:#7a8899}.aline b{color:#394a61}.metric span{color:#7d8999}.metric b{color:#17263d}.notes{background:#fbfcfe}.kap a{color:#3157c8}.empty{color:#8491a1}.err{background:#fff2f3;color:#a93342;border-color:#f2c4ca}.viewtag.add{color:#087d59;border-color:#b8dfd1;background:#eef9f5}.viewtag.hold{color:#3157c8;border-color:#cbd7ef;background:#f0f4fc}.viewtag.reduce{color:#9a650d;border-color:#ead7b3;background:#fff8ea}.viewtag.exit{color:#c93e4d;border-color:#f0c5ca;background:#fff2f3}.back{background:rgba(15,27,45,.28)}.guidance{padding:20px;margin:0 0 12px}.guidehead{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.guidehead h2{margin:5px 0 6px;font-size:21px;letter-spacing:-.3px}.guidehead p{margin:0;color:#607086;max-width:760px;line-height:1.55}.modeBadge{min-width:126px;text-align:center;padding:10px 14px;border-radius:999px;background:#eef3fb;border:1px solid #cfd9e9;color:#183b72;font-weight:900;font-size:11px}.modeBadge.green{background:#eef9f5;border-color:#bee1d5;color:#0a7c5c}.modeBadge.amber{background:#fff7e8;border-color:#edd8ad;color:#9b670e}.modeBadge.red{background:#fff1f2;border-color:#efc4c9;color:#bd3f4d}.guidegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0}.guidebox{padding:13px 14px;border:1px solid #e2e8f0;border-radius:12px;background:linear-gradient(180deg,#fff,#fafbfd)}.guidebox span{display:block;color:#7b8798;font-size:9px;text-transform:uppercase;letter-spacing:.6px;font-weight:900}.guidebox b{display:block;color:#17263d;font-size:20px;margin-top:5px}.guidebox small{display:block;color:#7a8798;margin-top:4px;line-height:1.35}.guidesplit{display:grid;grid-template-columns:1.35fr .65fr;gap:10px}.guidepanel{border:1px solid #e2e8f0;border-radius:12px;background:#fbfcfe;padding:13px}.guidepanel h3{margin:0 0 9px;font-size:11px;color:#24364f}.actionrow{display:grid;grid-template-columns:90px 116px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid #e8edf3}.actionrow:first-child{border-top:0;padding-top:0}.actionrow .ticker{font-weight:900;color:#13253d}.actionrow .state{font-size:9px;font-weight:900;color:#3157c8;background:#edf2fb;border:1px solid #d3ddef;border-radius:999px;padding:5px 7px;text-align:center}.actionrow .state.bad{color:#c33d4d;background:#fff1f2;border-color:#efc6cb}.actionrow .state.wait{color:#96630b;background:#fff7e9;border-color:#ead9b8}.actionrow p{margin:0;color:#45566d;font-size:10px;line-height:1.45}.actionrow p b{color:#17263d}.roaditem{display:flex;gap:9px;padding:9px 0;border-top:1px solid #e8edf3}.roaditem:first-child{border-top:0;padding-top:0}.roadnum{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#183b72;color:#fff;font-size:9px;font-weight:900;flex:0 0 auto}.roaditem b{display:block;color:#1c2d45;font-size:10px;margin-bottom:2px}.roaditem span{color:#6f7d90;font-size:9.5px;line-height:1.4}@media(max-width:900px){.guidegrid{grid-template-columns:1fr 1fr}.guidesplit{grid-template-columns:1fr}}@media(max-width:620px){.guidehead{display:block}.modeBadge{display:inline-block;margin-top:10px}.guidegrid{grid-template-columns:1fr 1fr}.actionrow{grid-template-columns:72px 100px 1fr}}\n'''
          if '/* V5 LIGHT PROFESSIONAL THEME */' not in s:s=s.replace('</style>',css+'</style>',1)
          html=r'''\n<section class="panel guidance" id="guidance"><div class="guidehead"><div><div class="ey">Karar Kokpiti</div><h2 id="guideMode">Tarama bekleniyor</h2><p id="guideText">Piyasa, radar ve portföyünü tek cümlede özetleyip sıradaki işi göstereceğim.</p></div><div class="modeBadge" id="guideBadge">—</div></div><div class="guidegrid"><div class="guidebox"><span>Bugünün modu</span><b id="guideStance">—</b><small id="guideStanceText">Tarama bekleniyor</small></div><div class="guidebox"><span>Yeni alım adayı</span><b id="guideBuyCount">—</b><small>Sadece temiz adaylar</small></div><div class="guidebox"><span>Portföy uyarısı</span><b id="guideAlertCount">—</b><small>Azalt / çıkışı incele sinyalleri</small></div><div class="guidebox"><span>Karar disiplini</span><b>2 / 4</b><small>Teknik + piyasa hazır. Haber/KAP ve temel teyit son adım.</small></div></div><div class="guidesplit"><div class="guidepanel"><h3>Şimdi neye bakıyorum?</h3><div id="actionDesk"><div class="empty">Tarama bekleniyor.</div></div></div><div class="guidepanel"><h3>Bugünün yol haritası</h3><div id="roadmap"><div class="empty">Tarama bekleniyor.</div></div></div></div></section>\n'''
          if 'id="guidance"' not in s:
              marker='<section class="panel portfolio"'
              if marker not in s:raise SystemExit('portfolio marker not found')
              s=s.replace(marker,html+marker,1)
          js=r'''function renderGuidance(){if(!S.d)return;let m=S.d.market||{},h=m.health??50,a=(S.d.stocks||[]).map(en),go=a.filter(x=>dec(x).t==='Öncelikli aday').sort((x,y)=>y.score.total-x.score.total),warm=a.filter(x=>['Güçlü ama acele etme','Radar adayı','Erken sinyal'].includes(dec(x).t)).sort((x,y)=>y.score.total-x.score.total);let alerts=(S.pf||[]).map(p=>{let x=a.find(z=>z.symbol===p.symbol);return x?{p,x,v:portView(x,p)}:null}).filter(Boolean).filter(z=>['AZALT','BEKLE / AZALT','ÇIKIŞI İNCELE'].includes(z.v.tag));let stance='SEÇİCİ',badge='amber',txt='Yeni işlem olabilir ama yalnızca temiz adaylarda. Fiyatı kovalamak yerine teyit bekle.';if(h>=64&&go.length>=2){stance='FIRSAT ARA';badge='green';txt='Piyasa ve radar aynı anda destekliyor. Yine de işlemi tek seferde değil, planlı ilerlet.'}else if(h<42){stance='SAVUNMACI';badge='red';txt='Yeni işlemden önce mevcut riskleri kontrol et. Güçlü hissede bile acele etme.'}else if(h<52){stance='TEMKİNLİ';badge='amber';txt='Piyasa karışık. Öncelik portföyü korumak ve yalnızca güçlü ayrışanı izlemek.'}$('#guideStance').textContent=stance;$('#guideStanceText').textContent=txt;$('#guideBuyCount').textContent=go.length;$('#guideAlertCount').textContent=alerts.length;$('#guideBadge').textContent=stance;$('#guideBadge').className='modeBadge '+badge;$('#guideMode').textContent=alerts.length?`${alerts.length} portföy uyarısı önce kontrol edilmeli`:go.length?`${go.length} yeni aday var; önce en temizlerine bak`:'Bugün zorunlu işlem yok';$('#guideText').textContent=alerts.length?'Yeni alımdan önce mevcut pozisyonlardaki riski temizle. Sonra adaylara geç.':go.length?'Aşağıdaki adaylar teknik ve piyasa filtresini geçti. Hisse detayında Haber/KAP ve Temel sekmesini görmeden son kararı verme.':'Radar sana işlem yapmak zorunda olmadığını söylüyor. İzleme listesi var ama net avantaj sınırlı.';let list=[...go,...warm].filter((x,i,z)=>z.findIndex(y=>y.symbol===x.symbol)===i).slice(0,5);$('#actionDesk').innerHTML=list.length?list.map(x=>{let d=dec(x),cls=d.t==='Öncelikli aday'?'':d.t==='Şimdilik uzak dur'?'bad':'wait';return`<div class="actionrow" data-s="${x.symbol}"><div class="ticker">${x.symbol}<small style="display:block;color:#8794a5;font-weight:600;margin-top:2px">Radar ${fmt(x.score.total,0)}</small></div><div class="state ${cls}">${esc(d.t)}</div><p><b>${esc(d.s)}</b><br>${esc(d.n)}<br><span style="color:#8592a2">Fikri bozan: ${esc(d.b)}</span></p></div>`}).join(''):'<div class="empty">Bugün net yeni alım adayı yok. Zorla işlem üretmiyorum.</div>';let hotCount=a.filter(hot).length,steps=[];steps.push(alerts.length?[`Önce portföy`,`${alerts.length} pozisyonda azalt/çıkış kontrolü var.`]:[`Portföy kontrolü`,`Belirgin azalt/çıkış uyarısı yok.`]);steps.push(go.length?[`Yeni işlem`,`Önce ${go.slice(0,3).map(x=>x.symbol).join(', ')} detayını aç.`]:[`Yeni işlem`,`Bugün beklemek de geçerli bir karar.`]);steps.push(hotCount?[`Fiyat kovalamama`,`${hotCount} hissede kısa vadeli ısınma var; yükselirken peşinden gitme.`]:[`Fiyat disiplini`,`Belirgin aşırı ısınma sınırlı.`]);steps.push([`Son teyit`,`İşlemden önce Haber & KAP ve Temel sekmesini kontrol et.`]);$('#roadmap').innerHTML=steps.map((z,i)=>`<div class="roaditem"><div class="roadnum">${i+1}</div><div><b>${z[0]}</b><span>${z[1]}</span></div></div>`).join('');bind()}'''
          if 'function renderGuidance(){' not in s:
              marker='function renderDecision(){'
              if marker not in s:raise SystemExit('renderDecision marker not found')
              s=s.replace(marker,js+marker,1)
              s=s.replace(marker,'function renderDecision(){renderGuidance();',1)
          p.write_text(s)
          PY
      - name: Commit V5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade dashboard to V5 decision cockpit [skip ci]"
          git push